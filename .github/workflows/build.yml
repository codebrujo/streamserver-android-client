name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret is not set - the APK is signed with a throwaway debug key, updates will need a reinstall"
          fi

      - name: Build
        id: build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease 2>&1 | tee "$RUNNER_TEMP/build.log"
          cp app/build/outputs/apk/release/app-release.apk streamserver-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: streamserver-apk
          path: streamserver-*.apk

      # every build of main becomes a GitHub release: the APK can be downloaded straight from the phone
      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" streamserver-${{ github.run_number }}.apk \
            --title "Streamserver client 1.0.${{ github.run_number }}" --notes "Build of ${GITHUB_SHA::7}" --latest

      # build result + log tail on the ci-logs branch, so the result can be read with plain git
      - name: Save build log
        if: always()
        run: |
          set +e
          ref="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          dir="$RUNNER_TEMP/ci-logs"
          git clone --depth 1 --branch ci-logs "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$dir" 2>/dev/null \
            || { git init -q -b ci-logs "$dir"; git -C "$dir" remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"; }
          safe=$(echo "$ref" | tr '/' '_')
          {
            echo "branch: $ref"
            echo "commit: $GITHUB_SHA"
            echo "run: ${{ github.run_number }}"
            echo "result: ${{ steps.build.outcome }}"
            echo
            grep -E "^e: |error:|FAILURE|What went wrong|BUILD" "$RUNNER_TEMP/build.log" | head -150
            echo
            echo "---- tail ----"
            tail -80 "$RUNNER_TEMP/build.log"
          } > "$dir/$safe.log"
          cd "$dir"
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "build log: $ref ${GITHUB_SHA::7} ${{ steps.build.outcome }}"
          git push -q origin ci-logs
